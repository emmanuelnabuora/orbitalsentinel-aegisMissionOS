name: Security Audit

on:
  push: { branches: [main] }
  pull_request:
  schedule:
    # Weekly sweep — catches newly disclosed CVEs against unchanged pinned
    # dependencies, not just drift introduced by a PR.
    - cron: "0 13 * * 1"

permissions:
  contents: read

jobs:
  api-deps:
    name: API — dependency audit (pip-audit)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      # Isolated install of only this project's declared dependency tree —
      # do not reuse a runner-wide/system Python environment, which can
      # mask the real graph behind whatever the image happens to ship.
      - run: pip install -e .
      - run: pip install pip-audit
      - name: Audit installed dependency tree for known CVEs
        run: pip-audit

  web-deps:
    name: Web — dependency audit (npm audit)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      # --audit-level=high: fail CI on high/critical findings; moderate
      # findings (e.g. dev-server-only issues) surface in the log without
      # blocking merges. Raise to `moderate` once the current moderate
      # findings (esbuild/vite dev-server) are cleared.
      - name: Audit dependency tree for known CVEs
        run: npm audit --audit-level=high

  secret-scan:
    name: Repo — secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Scan full history for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
