name: CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API — lint & test (sqlite + postgres)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis-ci
          POSTGRES_DB: aegis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aegis"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - name: Tests (sqlite — hermetic)
        run: pytest -q
      - name: Tests (postgres — deploy dialect)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://aegis:aegis-ci@localhost:5432/aegis_test
        run: pytest -q
      - name: Migrations apply cleanly on postgres — including on populated data
        env:
          DATABASE_URL: postgresql+asyncpg://aegis:aegis-ci@localhost:5432/aegis_test
          AEGIS_ADMIN_EMAIL: ci-admin@orbitalsentinel.io
          AEGIS_ADMIN_PASSWORD: CiAdminPassw0rd!
        run: |
          python -m alembic downgrade base
          python -m alembic upgrade head
          # Re-apply the newest migration against seeded rows: NOT NULL columns
          # without server defaults pass on empty DBs and fail in production.
          python scripts/seed.py
          python -m alembic downgrade -1
          python -m alembic upgrade head

  web:
    name: Web — typecheck & build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run build

  docker:
    name: API — image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aegis-api:ci apps/api
